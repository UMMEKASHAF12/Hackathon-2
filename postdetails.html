<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Details</title>
  <link rel="stylesheet" href="postdetails.css">

  </head>
<body>

  <div class="post-detail-container">
  <h1 id="postTitle">Loading...</h1>
  <img id="postImage" src="" alt="Post Image">
  <p id="postDescription"></p>
  <span id="postUsername"></span>
  <span id="postDateTime"></span>
  <br>
  <a href="home.html" class="back-btn">Back</a>
</div>

<script type="module">
import supabase from "./config.js";

// Get post ID from URL
const params = new URLSearchParams(window.location.search);
const postId = params.get("id");

if (!postId) {
  alert("No post selected!");
  window.location.href = "home.html";
}

async function loadPost() {
  const { data: post, error } = await supabase
    .from("Posts")
    .select("*")
    .eq("id", postId)
    .single();

  if (error || !post) {
    alert("Post not found!");
    window.location.href = "home.html";
    return;
  }

  // Fill data into DOM
  document.getElementById("postTitle").innerText = post.title;
  document.getElementById("postImage").src = post.img_url;
  document.getElementById("postDescription").innerText = post.description;
  document.getElementById("postUsername").innerText = "Posted by: " + post.username;

  // Format date & time
  const postDate = new Date(post.created_at);
  const formattedDate = postDate.toLocaleDateString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "numeric"
  });
  const formattedTime = postDate.toLocaleTimeString(undefined, {
    hour: "2-digit",
    minute: "2-digit"
  });

  document.getElementById("postDateTime").innerText = `Posted on: ${formattedDate} at ${formattedTime}`;
}

loadPost();
</script>
</body>
</html>
